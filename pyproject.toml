[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-forecast"
version = "1.0.0"
description = "Reference implementation of the MOSAIC county-month forecasting model"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "pyarrow>=14",
  "torch>=2.2,<3",
]

[tool.setuptools]
packages = ["mosaic_forecast"]
